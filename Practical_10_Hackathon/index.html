<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Hackathon - Event Dashboard</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; font-family: sans-serif;
            color: white; background-color: transparent; padding-top: 50px;
        }
        #bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover; filter: brightness(40%); transform: scale(1.35);
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: red; text-transform: uppercase; letter-spacing: 2px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card {
            background: rgba(0, 0, 0, 0.6); padding: 30px; border-radius: 8px;
            border: 1px solid #444; width: 300px; text-align: center;
        }
        .card h3 { color: red; text-transform: uppercase; }
        button {
            width: 100%; padding: 10px; margin-top: 15px; border: none;
            border-radius: 4px; background: red; color: white;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="../Practical_1_Basic_HTML/video.mp4" type="video/mp4">
    </video>
    <header>
        <h1>Stark Event Dashboard</h1>
        <p>Mini Hackathon Submission</p>
    </header>
    <div class="container">
        <div class="card">
            <h3>Tech Conference 2026</h3>
            <p>Date: Nov 15, 2026</p>
            <p>Location: New York</p>
            <button>Register</button>
        </div>
        <div class="card">
            <h3>Web Dev Bootcamp</h3>
            <p>Date: Dec 01, 2026</p>
            <p>Location: Online</p>
            <button>Register</button>
        </div>
    </div>
</body>
</html>
